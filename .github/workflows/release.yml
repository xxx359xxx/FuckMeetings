name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            bundles: nsis
            config: ""
            artifact: release-windows
          - os: macos-15
            label: macOS Apple Silicon
            bundles: app,dmg
            config: "--config src-tauri/tauri.macos.conf.json"
            artifact: release-macos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Verify release version and architecture
        shell: bash
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          version = os.environ['EXPECTED_VERSION'].removeprefix('v')
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          assert json.loads(pathlib.Path('package.json').read_text())['version'] == version
          assert json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version'] == version
          assert re.search(r'^version = "' + re.escape(version) + r'"$', pathlib.Path('src-tauri/Cargo.toml').read_text(), re.M)
          PY
          if [ "$RUNNER_OS" = macOS ]; then test "$(uname -m)" = arm64; fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS audio and Whisper resources
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-resources.sh
      - name: Build signed updater and installer artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          pnpm exec tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json ${{ matrix.config }}
      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "$RUNNER_OS" = macOS ]; then
            cp src-tauri/target/release/bundle/dmg/*.dmg release-artifacts/
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz release-artifacts/
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig release-artifacts/
          else
            cp src-tauri/target/release/bundle/nsis/*-setup.exe release-artifacts/
            cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig release-artifacts/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Prepare draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Create merged updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse
          directory = pathlib.Path('release-artifacts')
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          platforms = {}
          for pattern, platform in [('*.app.tar.gz', 'darwin-aarch64'), ('*-setup.exe', 'windows-x86_64')]:
              matches = list(directory.glob(pattern))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {pattern}, found {len(matches)}')
              archive = matches[0]
              signature = archive.with_name(archive.name + '.sig').read_text().strip()
              if not signature:
                  raise SystemExit(f'Empty signature for {archive.name}')
              url = 'https://github.com/{}/releases/download/{}/{}'.format(
                  os.environ['REPOSITORY'], urllib.parse.quote(os.environ['RELEASE_TAG']), urllib.parse.quote(archive.name))
              platforms[platform] = {'signature': signature, 'url': url}
          if len(list(directory.glob('*.dmg'))) != 1 or len(list(directory.glob('*-setup.exe'))) != 1:
              raise SystemExit('Expected one DMG and one Windows installer')
          manifest = {'version': version, 'notes': 'FuckMeetings ' + os.environ['RELEASE_TAG'], 'pub_date': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat().replace('+00:00', 'Z'), 'platforms': platforms}
          (directory / 'latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft --prerelease=false
          else
            gh release create "$RELEASE_TAG" --draft --title "FuckMeetings $RELEASE_TAG" --notes 'Signed macOS and Windows installers with auto-update artifacts.'
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
