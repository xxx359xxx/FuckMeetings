name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            bundles: nsis
            config: ""
          - os: macos-15
            label: macOS Apple Silicon
            bundles: dmg
            config: "--config src-tauri/tauri.macos.conf.json"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS audio and Whisper resources
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-resources.sh
      - name: Build and upload signed release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FuckMeetings ${{ github.ref_name }}
          releaseBody: |
            ## Исправления
            - Ускорено появление распознанной речи в оверлее.
            - Потоковые ответы остаются на месте, пока пользователь читает предыдущий текст.
            - Закрытие главного окна завершает приложение и запущенные CLI-процессы.

            Автообновление включает подписанные updater-артефакты и `latest.json`.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: >-
            --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json
            ${{ matrix.config }}
